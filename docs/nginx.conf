# Example nginx site config for Romanum (QuixPOS forum).
#
# Layout assumed:
#   - Vite build files in /var/www/romanum/dist  (copy contents of `dist/` after `npm run build`)
#     Must contain index.html at that path:  /var/www/romanum/dist/index.html
#   - Node API on 127.0.0.1:3001               (PORT=3001, bind loopback only)
#
# Deploy tip:
#   npm run build
#   rsync -a --delete dist/ /var/www/romanum/dist/
#
# Install (Debian/Ubuntu-style):
#   sudo cp docs/nginx.conf /etc/nginx/sites-available/romanum
#   sudo ln -s /etc/nginx/sites-available/romanum /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set CLIENT_ORIGIN on the API to this public origin (e.g. https://forum.quixpos.com).

upstream romanum_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name forum.quixpos.com;

    # Uncomment after certbot (or your own certs):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/forum.quixpos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/forum.quixpos.com/privkey.pem;

    root /var/www/romanum/dist;
    index index.html;

    # Posts may include base64 images; keep above Express's 1mb JSON limit.
    client_max_body_size 2m;

    # Security / privacy baselines
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Gzip static + proxied JSON (API also compresses; double-gzip is avoided by nginx)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API (Express on loopback) ---
    location /api/ {
        proxy_pass http://romanum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events — must not be buffered
    location = /api/events {
        proxy_pass http://romanum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control no-cache;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # Hashed Vite assets (JS/CSS/fonts) — long cache
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: serve real files; otherwise fall through to named location (avoids
    # "rewrite or internal redirection cycle" when index.html is missing).
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # Optional: do not serve dotfiles from the web root
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
