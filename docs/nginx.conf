# Example nginx site config for Romanum (QuixPOS forum).
#
# Layout assumed:
#   - Vite + SSG output in /var/www/romanum/dist  (contents of repo `dist/` after `npm run build`)
#     Must contain index.html at that path:  /var/www/romanum/dist/index.html
#     Prerendered pages live as directories, e.g.:
#       /var/www/romanum/dist/section/<slug>/index.html
#       /var/www/romanum/dist/topic/<slug>/index.html
#       /var/www/romanum/dist/privacy/index.html
#   - Node API on 127.0.0.1:3001               (PORT=3001, bind loopback only)
#     API stays API-only (no static hosting). Content mutations trigger a
#     debounced `npm run ssg` (SSG_REBUILD=0 to disable) which refreshes HTML in dist/.
#     Full `npm run build` is only needed when client/SSR JS changes.
#   - SSR bundle lives outside the web root (repo `dist-ssr/`); do not copy it
#     into /var/www/romanum/dist.
#
# Deploy tip:
#   npm run build
#   rsync -a --delete dist/ /var/www/romanum/dist/
#
# Install (Debian/Ubuntu-style):
#   sudo cp docs/nginx.conf /etc/nginx/sites-available/romanum
#   sudo ln -s /etc/nginx/sites-available/romanum /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Set CLIENT_ORIGIN on the API to this public origin (e.g. https://forum.quixpos.com).

upstream romanum_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name forum.quixpos.com;

    # Uncomment after certbot (or your own certs):
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    # ssl_certificate     /etc/letsencrypt/live/forum.quixpos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/forum.quixpos.com/privkey.pem;

    root /var/www/romanum/dist;
    index index.html;

    # Posts may include base64 images; keep above Express's 1mb JSON limit.
    client_max_body_size 2m;

    # Security / privacy baselines
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Gzip static + proxied JSON (API also compresses; double-gzip is avoided by nginx)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # --- API (Express on loopback) ---
    location /api/ {
        proxy_pass http://romanum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Server-Sent Events — must not be buffered / gzip'd.
    # Long-lived EventSource over HTTP/2 is fragile if nginx buffers or compresses
    # the stream (Chrome: ERR_HTTP2_PROTOCOL_ERROR / ERR_HTTP2_PING_FAILED).
    # If PING failures persist after this block + app heartbeats, try dropping
    # `http2` from `listen 443 ssl http2` (HTTP/1.1 is far more stable for SSE).
    location = /api/events {
        proxy_pass http://romanum_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_set_header Cache-Control no-cache;

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_socket_keepalive on;
        gzip off;
        chunked_transfer_encoding off;

        # Avoid lingering gzip modules / brotli on this location if enabled globally.
        proxy_hide_header Content-Encoding;

        proxy_connect_timeout 5s;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;

        add_header Cache-Control "no-cache, no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Sitemap / robots (written by SSG into dist/)
    location = /sitemap.xml {
        try_files $uri =404;
        access_log off;
        default_type application/xml;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /robots.txt {
        try_files $uri =404;
        access_log off;
        default_type text/plain;
        expires 1h;
        add_header Cache-Control "public";
    }

    # Hashed Vite assets (JS/CSS/fonts) — long cache
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSG Emotion critical CSS (content-hashed) — long cache
    location /ssg-css/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSG extracted body images (AVIF, content-hashed) — long cache
    location /media/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SSG pages + SPA fallback:
    #   $uri          — exact file (rare)
    #   $uri/         — directory with index.html (section/<slug>/, topic/<slug>/, privacy/)
    #   @spa          — client-only routes (/starred, /admin/sections) and unknown paths
    location / {
        try_files $uri $uri/ @spa;
    }

    location @spa {
        try_files /index.html =404;
    }

    # Optional: do not serve dotfiles from the web root
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
